# Leader (prefix) key: Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Enable vim keybindings
setw -g mode-keys vi

# Enable mouse
set -g mouse on

# Status bar: dark forest green with white text
set -g status-style 'bg=#1e4d2b,fg=white'

# Split panes in the same directory (useful for worktrees)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation: leader + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Machine-specific overrides (untracked); last so it can override anything above
source-file -q ~/.config/tmux/local.conf
